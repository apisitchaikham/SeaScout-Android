name: Build iOS (Sea Scout)

# Same trigger as "Build Android": one push to main builds BOTH apps from the same www/ folder.
on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'SeaScout_Android_r17_Source_Project.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      SEA_BUILD: ${{ github.run_number }}
      # Signing runs only after these secrets are added (Apple Developer account needed)
      HAS_SIGNING: ${{ secrets.IOS_P12_BASE64 != '' && secrets.IOS_PROFILE_BASE64 != '' }}
      HAS_ASC: ${{ secrets.ASC_KEY_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Unpack world tide tiles into the web app (same as Android)
        run: unzip -q -o data/eot20.zip -d www/ && ls www/eot20 | head

      - name: Copy web app into iOS
        run: npx cap sync ios

      - name: Check Xcode
        run: xcodebuild -version

      # 1) Always: compile for the iOS Simulator without signing — proves the shared code builds on iOS.
      - name: Build for iOS Simulator (no signing)
        working-directory: ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CURRENT_PROJECT_VERSION=$SEA_BUILD \
            CODE_SIGNING_ALLOWED=NO build
          cd build/Build/Products/Debug-iphonesimulator && zip -qry "$GITHUB_WORKSPACE/SeaScout-simulator.zip" App.app

      - uses: actions/upload-artifact@v4
        with:
          name: SeaScout-ios-simulator
          path: SeaScout-simulator.zip
          retention-days: 14

      # 2) After secrets exist: signed .ipa for TestFlight / App Store.
      - name: Install signing certificate and profile
        if: env.HAS_SIGNING == 'true'
        env:
          P12: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          KC="$RUNNER_TEMP/sea.keychain-db"; KCPW="$(uuidgen)"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KCPW" "$KC"
          security list-keychain -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/sea.mobileprovision"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<< "$(security cms -D -i "$RUNNER_TEMP/sea.mobileprovision")")
          NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' /dev/stdin <<< "$(security cms -D -i "$RUNNER_TEMP/sea.mobileprovision")")
          cp "$RUNNER_TEMP/sea.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "SEA_PROFILE_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Archive and export signed .ipa
        if: env.HAS_SIGNING == 'true'
        working-directory: ios/App
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/SeaScout.xcarchive" \
            CURRENT_PROJECT_VERSION=$SEA_BUILD MARKETING_VERSION=1.0.$SEA_BUILD \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$SEA_PROFILE_NAME" archive
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict><key>app.seascout.marine</key><string>$SEA_PROFILE_NAME</string></dict>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/SeaScout.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/ipa"
          ls -la "$RUNNER_TEMP/ipa"

      - uses: actions/upload-artifact@v4
        if: env.HAS_SIGNING == 'true'
        with:
          name: SeaScout-ios-ipa
          path: ${{ runner.temp }}/ipa/*.ipa
          retention-days: 30

      # 3) Optional: send the .ipa to TestFlight (App Store Connect API key secrets).
      - name: Upload to TestFlight
        if: env.HAS_SIGNING == 'true' && env.HAS_ASC == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY: ${{ secrets.ASC_KEY_BASE64 }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$ASC_KEY" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          xcrun altool --upload-app -t ios -f "$(ls $RUNNER_TEMP/ipa/*.ipa | head -1)" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Clean up keychain
        if: always() && env.HAS_SIGNING == 'true'
        run: security delete-keychain "$RUNNER_TEMP/sea.keychain-db" || true
