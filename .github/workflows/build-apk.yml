
name: Build Sea Scout APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'SeaScout_Android_r17_Source_Project.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -q SeaScout_Android_r17_Source_Project.zip -d source
          test -f source/SeaScout_Android_r17/settings.gradle
          test -f source/SeaScout_Android_r17/app/build.gradle

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        working-directory: source/SeaScout_Android_r17
        run: |
          gradle --no-daemon :app:assembleDebug

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: seascout-r17-${{ github.run_number }}
          name: Sea Scout Android r17 Build ${{ github.run_number }}
          files: source/SeaScout_Android_r17/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: false
          prerelease: true
